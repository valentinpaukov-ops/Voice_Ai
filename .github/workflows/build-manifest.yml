name: Обновить манифест эфира

on:
  push:
    paths:
      - 'audio/**'
      - '!audio/manifest.json'
      - '.github/workflows/build-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Библиотека для чтения тегов и длительности
        run: pip install --quiet mutagen || true

      - name: Пересобрать список эфира
        run: |
          python - <<'PYTHON'
          import json, os, re, unicodedata
          from datetime import datetime, timezone

          AUDIO_DIR = "audio"
          MANIFEST = os.path.join(AUDIO_DIR, "manifest.json")
          AUDIO_EXT = {".mp3", ".m4a", ".aac", ".wav", ".ogg", ".oga",
                       ".opus", ".flac", ".webm", ".mp4"}
          PREFIX_RE = re.compile(r"^(\d{4}[-._]\d{2}[-._]\d{2}|\d{1,4})[ _.\-]+")
          DATE_RE = re.compile(r"^(\d{4})[-._](\d{2})[-._](\d{2})")

          # Кириллица в имени файла пишется двумя способами: «й» одним знаком
          # или как «и» с надстрочной дужкой. На вид не отличить, а для сервера
          # это разные файлы — и запись перестаёт играть. Сводим имена к одной
          # форме, чтобы сверять их по смыслу, а не побайтно.
          def nkey(name):
              return unicodedata.normalize("NFC", name)

          def title_from_filename(stem):
              name = PREFIX_RE.sub("", stem).replace("_", " ").replace("-", " ")
              name = re.sub(r"\s+", " ", name).strip() or stem
              return name[:1].upper() + name[1:]

          def read_tags(path):
              try:
                  from mutagen import File as MF
                  a = MF(path, easy=True)
              except Exception:
                  return None, None, None
              if a is None:
                  return None, None, None
              dur = None
              try:
                  L = getattr(getattr(a, "info", None), "length", None)
                  if L and L > 0:
                      dur = round(float(L), 1)
              except Exception:
                  pass
              def first(k):
                  try:
                      v = a.get(k)
                  except Exception:
                      return None
                  if isinstance(v, list) and v:
                      v = v[0]
                  return v.strip() if isinstance(v, str) and v.strip() else None
              return first("title"), (first("artist") or first("albumartist")), dur

          os.makedirs(AUDIO_DIR, exist_ok=True)
          found = sorted(f for f in os.listdir(AUDIO_DIR)
                         if os.path.splitext(f)[1].lower() in AUDIO_EXT
                         and os.path.isfile(os.path.join(AUDIO_DIR, f)))

          existing = {}
          air = {}
          if os.path.exists(MANIFEST):
              try:
                  with open(MANIFEST, encoding="utf-8") as fh:
                      data = json.load(fh)
                  for t in (data.get("tracks") or []):
                      if isinstance(t, dict) and t.get("file"):
                          existing[t["file"]] = t
                  # ПРОГРАММА ЭФИРА ПО ДНЯМ — её ведёт редактор со страницы,
                  # робот обязан сохранить её как есть, иначе она пропадёт
                  # при первой же загрузке файла.
                  raw_air = data.get("air")
                  if isinstance(raw_air, dict):
                      for day, files in raw_air.items():
                          if isinstance(files, list):
                              air[day] = [f for f in files if isinstance(f, str)]
              except Exception as e:
                  print("манифест не прочитан (%s) — собираю заново" % e)

          # ПОРЯДОК ЭФИРА ЗАДАЁТ РЕДАКТОР, а не алфавит: сохраняем порядок из
          # манифеста как есть, новые файлы дописываем в конец.
          have = set(found)
          disk_by_key = {}
          for f in found:
              disk_by_key.setdefault(nkey(f), f)

          # имя из манифеста -> имя, под которым файл реально лежит на диске
          resolved = {}
          for f in existing:
              real = f if f in have else disk_by_key.get(nkey(f))
              if real:
                  resolved[f] = real
                  if real != f:
                      print("  ~ %s: имя выправлено по файлу на диске" % f)

          files = [resolved[f] for f in existing if f in resolved]
          taken = set(files)
          files += [f for f in found if f not in taken]
          prev_by_disk = dict((resolved[f], existing[f]) for f in resolved)

          tracks, added, kept = [], 0, 0
          for fn in files:
              path = os.path.join(AUDIO_DIR, fn)
              stem = os.path.splitext(fn)[0]
              prev = prev_by_disk.get(fn)
              if prev:
                  e = dict(prev); e["file"] = fn
                  if not e.get("duration"):
                      _, _, d = read_tags(path)
                      if d: e["duration"] = d
                  # дату дописываем, если её ещё нет; проставленную вручную не трогаем
                  if not e.get("date"):
                      md = DATE_RE.match(stem)
                      if md: e["date"] = "%s-%s-%s" % md.groups()
                  kept += 1
              else:
                  tt, ta, d = read_tags(path)
                  e = {"file": fn,
                       "title": tt or title_from_filename(stem),
                       "host": ta or "Voice Ai",
                       "tag": "Эфир"}
                  m = DATE_RE.match(stem)
                  if m: e["date"] = "%s-%s-%s" % m.groups()
                  if d: e["duration"] = d
                  added += 1
                  print("  + %s -> %s" % (fn, e["title"]))
              e["size"] = os.path.getsize(path)
              tracks.append(e)

          for f in existing:
              if f not in resolved:
                  print("  - %s (файла больше нет)" % f)

          # из программы дней вычищаем ссылки на файлы, которых уже нет,
          # иначе в дне останется запись-призрак, которая не играет
          alive = set(files)
          clean_air, dropped, fixed = {}, 0, 0
          for day in sorted(air.keys()):
              alive_files = []
              for f in air[day]:
                  real = f if f in alive else disk_by_key.get(nkey(f))
                  if real:
                      if real != f: fixed += 1
                      alive_files.append(real)
                  else:
                      dropped += 1
              clean_air[day] = alive_files
          if fixed:
              print("  в программе дней выправлено имён: %d" % fixed)
          if dropped:
              print("  из программы дней убрано ссылок на удалённые файлы: %d" % dropped)

          out = {"updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                 "tracks": tracks}
          if clean_air:
              out["air"] = clean_air
              print("Программа эфира: %d %s" % (len(clean_air),
                    "день" if len(clean_air) == 1 else "дн."))

          with open(MANIFEST, "w", encoding="utf-8") as fh:
              json.dump(out, fh, ensure_ascii=False, indent=2)
              fh.write("\n")

          # Тот же манифест отдельным файлом-скриптом: виджет на чужом сайте
          # не всегда может прочитать чужой JSON — браузер требует на это
          # разрешения сервера, а заголовки GitHub Pages нам неподвластны.
          # Скрипт же грузится с любого домена без разрешений.
          with open(os.path.join(AUDIO_DIR, "manifest.js"), "w", encoding="utf-8") as fh:
              fh.write("window.__voiceAiManifest=")
              json.dump(out, fh, ensure_ascii=False, separators=(",", ":"))
              fh.write(";\n")

          mb = sum(t.get("size", 0) for t in tracks) / 1e6
          print("Готово: %d записей (новых %d, сохранено %d), %.1f МБ" % (len(tracks), added, kept, mb))
          if mb > 700:
              print("ВНИМАНИЕ: приближаемся к лимиту GitHub Pages в 1 ГБ")
          PYTHON

      - name: Показать получившийся список
        run: cat audio/manifest.json

      - name: Зафиксировать изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/manifest.json audio/manifest.js
          if git diff --staged --quiet; then
            echo "Манифест не изменился — коммит не нужен."
          else
            git commit -m "Обновлён манифест эфира"
            git push
          fi
